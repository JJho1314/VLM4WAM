# @package _global_

defaults:
  - override /data: libero_2cam_cosmos
  - override /model: fastwam_cosmos
  - _self_

# dataloading — 512 global batch = 8 (per-GPU) x 8 GPUs x 8 (grad accum)
batch_size: 8
num_workers: 16

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4      # sqrt-scaled for 512 global batch: 5e-5 x sqrt(512/128)=2x (safer than linear 4x=2e-4 for ~4B fine-tune)
num_epochs: 10
max_steps: null
log_every: 10
save_every: 200          # ~1.6h between checkpoints (FSDP all-rank save; safe on preemptible shared node)
eval_every: 999999999    # eval disabled (no Cosmos infer path wired yet)

# training
gradient_accumulation_steps: 8
weight_decay: 1e-2
mixed_precision: bf16
resume: null
