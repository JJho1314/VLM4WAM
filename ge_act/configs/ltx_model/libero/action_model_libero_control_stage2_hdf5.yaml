# Control run for the Baton Stage-2 action recipe: identical data pipeline
# (LiberoFastWAMHDF5Dataset, stateless Baton sampling, packed action+state),
# identical optimizer/schedule, but NO semantic branch. Any difference between
# this run and action_model_libero_baton_stage2_hdf5.yaml is attributable to
# the semantic conditioning alone.
#
# Launch (no BATON_* materialization is needed for this config):
#   cd ge_act && bash scripts/train.sh main.py \
#     configs/ltx_model/libero/action_model_libero_control_stage2_hdf5.yaml
model_name: ltx_train
is_i2v: true
report_to: None
tracker_name: ltx_control_stage2_hdf5_trainer

logging_dir: logs
output_dir: /data/user/jhe724/junjie/outputs/libero_ltx_control_stage2_hdf5
pretrained_model_name_or_path: /data/user/jhe724/junjie/weights/LTX-Video

train_data_class_path: data/libero_fastwam_hdf5_dataset.py
train_data_class: LiberoFastWAMHDF5Dataset
val_data_class_path: data/libero_fastwam_hdf5_dataset.py
val_data_class: LiberoFastWAMHDF5Dataset

tokenizer_class_path: transformers
tokenizer_class: T5Tokenizer
textenc_class_path: transformers
textenc_class: T5EncoderModel
vae_class_path: models/ltx_models/autoencoder_kl_ltx.py
vae_class: AutoencoderKLLTXVideo
diffusion_model_class_path: models/ltx_models/transformer_ltx_multiview.py
diffusion_model_class: LTXVideoTransformer3DModel
diffusion_scheduler_class_path: diffusers
diffusion_scheduler_class: FlowMatchEulerDiscreteScheduler
pipeline_class_path: models/pipeline/custom_pipeline.py
pipeline_class: CustomPipeline

return_action: true
# Action recipe (matches the released GE-Act LIBERO checkpoints): no video loss,
# future latents are pure noise, proprioception packed into the action token.
return_video: false
train_mode: action_full
action_loss_scale: 1.0

train_steps: 20000
train_epochs: 10000
steps_to_save: 5000
steps_to_log: 20
steps_to_val: 5000

mixed_precision: bf16
allow_tf32: true
nccl_timeout: 600
seed: 42

enable_slicing: true
enable_tiling: true
add_state: true
rand_init_action: true
caption_dropout_p: 0.0

# 8 samples/GPU * 8 GPUs * 2 accumulation = global batch 128.
batch_size: 8
gradient_accumulation_steps: 2
dataloader_num_workers: 4
dataloader_prefetch_factor: 2
pin_memory: true
gradient_checkpointing: true
noise_to_first_frame: 0.1

optimizer: adamw
lr: 2.0e-5
action_lr: 1.0e-4
semantic_lr: 5.0e-5
beta1: 0.9
beta2: 0.95
beta3: 0.999
epsilon: 1.0e-8
weight_decay: 1.0e-5
optimizer_8bit: false
optimizer_torchao: false
scale_lr: false
max_grad_norm: 1.0

lr_scheduler: cosine
lr_warmup_steps: 1000
lr_num_cycles: 1
lr_power: 1.0

flow_weighting_scheme: none
flow_logit_mean: 0.0
flow_logit_std: 1.0
flow_mode_scale: 1.29
pixel_wise_timestep: true

semantic_plan:
  enabled: false

diffusion_model:
  # Deployment launcher requires BATON_GE_BASE_CHECKPOINT.
  model_path: /data/user/jhe724/junjie/weights/Genie-Envisioner/GE_base_fast_actinterp.safetensors
  config:
    activation_fn: gelu-approximate
    attention_bias: true
    attention_head_dim: 64
    attention_out_bias: true
    caption_channels: 4096
    cross_attention_dim: 2048
    in_channels: 128
    norm_elementwise_affine: false
    norm_eps: 1.0e-6
    num_attention_heads: 32
    num_layers: 28
    out_channels: 128
    patch_size: 1
    patch_size_t: 1
    qk_norm: rms_norm_across_heads
    action_expert: true
    # 7 eef actions + 8 proprioceptive state dims packed per token.
    action_in_channels: 15
    action_out_channels: 15
    action_num_attention_heads: 16
    action_attention_head_dim: 32

data:
  train:
    manifest_path: /data/user/jhe724/junjie/datasets/LIBERO-fastwam-hdf5/manifest.json
    stat_file: configs/ltx_model/libero/libero_fastwam_mix.json
    source_fps: 20
    sample_n_frames: 500
    valid_cam: [observation.images.image, observation.images.wrist_image]
    chunk: 9
    action_chunk: 36
    n_previous: 4
    previous_pick_mode: random
    baton_sampling_algorithm: libero_fastwam_hdf5_stateless_sha256
    baton_sampling_version: 1
    baton_sampling_seed: 42
    action_type: absolute
    action_space: eef
    pack_action_state: true
    train_dataset: true
  val:
    manifest_path: /data/user/jhe724/junjie/datasets/LIBERO-fastwam-hdf5/manifest.json
    stat_file: configs/ltx_model/libero/libero_fastwam_mix.json
    source_fps: 20
    sample_n_frames: 500
    valid_cam: [observation.images.image, observation.images.wrist_image]
    chunk: 9
    action_chunk: 36
    n_previous: 4
    previous_pick_mode: random
    baton_sampling_algorithm: libero_fastwam_hdf5_stateless_sha256
    baton_sampling_version: 1
    baton_sampling_seed: 42
    action_type: absolute
    action_space: eef
    pack_action_state: true
    train_dataset: false

use_color_jitter: true
num_inference_step: 10
noisy_video: true
load_weights: true
resume_from_checkpoint: null

use_deepspeed: true
deepspeed:
  zero_optimization:
    stage: 2
  fp16:
    enabled: false
  bf16:
    enabled: true
  gradient_clipping: 1.0
